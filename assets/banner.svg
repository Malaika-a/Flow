<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0B10"/>
      <stop offset="1" stop-color="#14202B"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#15D8ED" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#15D8ED"/>
      <stop offset="1" stop-color="#15D8ED" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <circle cx="1080" cy="60" r="120" fill="#15D8ED" opacity="0.07"/>
  <circle cx="120" cy="280" r="100" fill="#57A5DC" opacity="0.08"/>
  <text x="600" y="170" text-anchor="middle" font-family="'Arial Black','Segoe UI',Arial,sans-serif" font-size="120" font-weight="900" letter-spacing="14" fill="#15D8ED" filter="url(#glow)">FLOW</text>
  <rect x="300" y="200" width="600" height="3" fill="url(#line)"/>
  <text x="600" y="250" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="28" fill="#9FB8C9" letter-spacing="3">A MINIMAL TO-DO APP FOR ANDROID</text>
</svg>
